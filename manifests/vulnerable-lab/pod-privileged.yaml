# Pod Security 検証用: privileged + host 名前空間共有 + hostPath('/') マウント。
apiVersion: v1
kind: Pod
metadata:
  name: privileged-host-breakout
  namespace: vulnerable-lab
  labels:
    app: privileged-host-breakout
spec:
  hostNetwork: true
  hostPID: true
  hostIPC: true
  containers:
    - name: shell
      image: docker.io/library/alpine:3.20
      command: ["sleep", "infinity"]
      securityContext:
        privileged: true
        capabilities:
          add: ["SYS_ADMIN", "NET_ADMIN"]
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
