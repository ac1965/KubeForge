# CIS Kubernetes Benchmark を control-plane ノード上で実行する Job。
# kube-bench 公式ジョブ定義 (job-node.yaml 相当) を kind 向けに調整したもの。
# 実行後は `kubectl logs job/kube-bench` で結果を確認する。
#
# イメージは docker.io/aquasec/kube-bench ではなく、この診断コンテナ自身
# (kubeforge-toolbox, ソースから最新 go でビルドした kube-bench を同梱) を使う。
# 公式のビルド済みイメージはリリース時点の Go バージョンが固定されており、
# 埋め込まれた stdlib 由来の HIGH 脆弱性を Trivy が検出するため
# (docker/Dockerfile のコメント参照)。ローカルビルドのイメージなので、
# 実行前に `kind load docker-image kubeforge-toolbox --name <cluster>`
# (または Makefile の該当ターゲット) でノードに読み込ませておくこと。
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      hostPID: true
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: kube-bench
          image: kubeforge-toolbox:latest
          imagePullPolicy: IfNotPresent
          # イメージの ENTRYPOINT (/bin/bash) を上書きし、同梱の kube-bench を直接実行する。
          command: ["kube-bench"]
          args: ["run", "--targets", "master,node,etcd,policies", "--config-dir", "/opt/kube-bench/cfg"]
          securityContext:
            # kube-bench は /etc/kubernetes/pki 等の root 所有ファイルを
            # 読む必要があるため、イメージのデフォルトユーザー (forger) を上書きする。
            runAsUser: 0
          volumeMounts:
            - name: var-lib-etcd
              mountPath: /var/lib/etcd
              readOnly: true
            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: var-lib-kube-scheduler
              mountPath: /var/lib/kube-scheduler
              readOnly: true
            - name: var-lib-kube-controller-manager
              mountPath: /var/lib/kube-controller-manager
              readOnly: true
            - name: etc-systemd
              mountPath: /etc/systemd
              readOnly: true
            - name: lib-systemd
              mountPath: /lib/systemd/
              readOnly: true
            - name: srv-kubernetes
              mountPath: /srv/kubernetes/
              readOnly: true
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
            - name: usr-bin
              mountPath: /usr/local/mount-from-host/bin
              readOnly: true
            - name: etc-cni-netd
              mountPath: /etc/cni/net.d/
              readOnly: true
            - name: opt-cni-bin
              mountPath: /opt/cni/bin/
              readOnly: true
      restartPolicy: Never
      volumes:
        - name: var-lib-etcd
          hostPath:
            path: "/var/lib/etcd"
        - name: var-lib-kubelet
          hostPath:
            path: "/var/lib/kubelet"
        - name: var-lib-kube-scheduler
          hostPath:
            path: "/var/lib/kube-scheduler"
        - name: var-lib-kube-controller-manager
          hostPath:
            path: "/var/lib/kube-controller-manager"
        - name: etc-systemd
          hostPath:
            path: "/etc/systemd"
        - name: lib-systemd
          hostPath:
            path: "/lib/systemd"
        - name: srv-kubernetes
          hostPath:
            path: "/srv/kubernetes"
        - name: etc-kubernetes
          hostPath:
            path: "/etc/kubernetes"
        - name: usr-bin
          hostPath:
            path: "/usr/bin"
        - name: etc-cni-netd
          hostPath:
            path: "/etc/cni/net.d/"
        - name: opt-cni-bin
          hostPath:
            path: "/opt/cni/bin/"
