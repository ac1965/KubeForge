# kind クラスタ構成。
# デフォルト CNI (kindnet) は NetworkPolicy を十分にサポートしないため無効化し、
# Calico を後から適用する (README / Makefile の cluster-up を参照)。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubeforge-lab
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
  serviceSubnet: "10.96.0.0/16"
nodes:
  - role: control-plane
  - role: worker
  - role: worker
