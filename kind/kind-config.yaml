# kind クラスタ構成。
# デフォルト CNI (kindnet) は NetworkPolicy を十分にサポートしないため無効化し、
# Calico を後から適用する (README / Makefile の cluster-up を参照)。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubeforge-lab
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
  serviceSubnet: "10.96.0.0/16"
nodes:
  - role: control-plane
  - role: worker
  - role: worker
# kube-bench (CIS Kubernetes Benchmark) の一部 FAIL 項目 (profiling 有効化,
# 監査ログ未設定, ServiceAccount トークン長期化) を kubeadm の静的 Pod
# フラグレベルで是正する。ファイル権限/所有者系の FAIL は kind ノード
# コンテナの使い捨てファイルシステムに起因するため対象外
# (manifests/audits/kube-bench-job.yaml 実行結果を参照)。
#
# 1.2.5 (--kubelet-certificate-authority) はあえて含めていない。有効化すると
# apiserver→kubelet 間の TLS 検証が厳格化されるが、kind が自動生成する
# kubelet 証明書には適切な IP SANs が無いため `kubectl logs`/`exec` が
# ことごとく失敗するようになり、ラボとしての使い勝手を損なうため。
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        profiling: "false"
        audit-log-path: /var/log/apiserver/audit.log
        audit-log-maxage: "30"
        audit-log-maxbackup: "10"
        audit-log-maxsize: "100"
        service-account-extend-token-expiration: "false"
      extraVolumes:
        - name: audit-log
          hostPath: /var/log/apiserver
          mountPath: /var/log/apiserver
          pathType: DirectoryOrCreate
    controllerManager:
      extraArgs:
        profiling: "false"
    scheduler:
      extraArgs:
        profiling: "false"
